<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineMatch — AI Movie Recommendations</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a26;
      --accent: #e8b86d;
      --accent2: #c44569;
      --text: #f0ede8;
      --muted: #888;
      --border: rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(200, 80, 100, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(232, 184, 109, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 60px 0 40px;
      text-align: center;
      animation: fadeDown 0.8s ease both;
    }

    .logo-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(232,184,109,0.1);
      border: 1px solid rgba(232,184,109,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 300;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Form Card */
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      margin: 40px 0 60px;
      animation: fadeUp 0.8s 0.2s ease both;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    /* Search bar */
    .search-wrap {
      position: relative;
      margin-bottom: 36px;
    }

    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px 16px 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: rgba(232,184,109,0.4);
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    /* Genre grid */
    .genre-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 36px;
    }

    .genre-chip {
      position: relative;
    }

    .genre-chip input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .genre-chip label {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .genre-chip input:checked + label {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0a0f;
    }

    .genre-chip label:hover {
      border-color: rgba(232,184,109,0.4);
      color: var(--text);
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent2), #e8416e);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-tag">✦ AI-Powered</div>
      <h1>Cine<span>Match</span></h1>
      <p class="subtitle">Discover movies you'll love — powered by collaborative filtering and real-time data.</p>
    </header>

    <form class="form-card" action="/recommend" method="POST">
      <p class="section-label">Search by title</p>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" name="search" placeholder="e.g. Inception, The Dark Knight…"/>
      </div>

      <p class="section-label">Or pick your genres</p>
      <div class="genre-grid">
        {% for genre in genres %}
        <div class="genre-chip">
          <input type="checkbox" id="g_{{ loop.index }}" name="genres" value="{{ genre }}"/>
          <label for="g_{{ loop.index }}">{{ genre }}</label>
        </div>
        {% endfor %}
      </div>

      <button type="submit" class="btn-submit">Find My Movies →</button>
    </form>
  </div>
</body>
</html>
